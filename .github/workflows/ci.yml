name: task-tracker ci
on:
  push:
    branches: 
      - main
env:
  DOCKERHUB_USERNAME: prashantmhamunkar
  IMAGE_TAG: ${{ github.sha }}
 
jobs:

  build-push:
    name: Checkout code build and push
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Frontend Docker Image
        run: docker build -t $DOCKERHUB_USERNAME/tasktracker-frontend:$IMAGE_TAG ./frontend

      - name: Build Backend Docker Image
        run: docker build -t $DOCKERHUB_USERNAME/tasktracker-backend:$IMAGE_TAG ./backend

      - name: Push Frontend Image to Docker Hub
        run: docker push $DOCKERHUB_USERNAME/tasktracker-frontend:$IMAGE_TAG

      - name: Push Backend Image to Docker Hub
        run: docker push $DOCKERHUB_USERNAME/tasktracker-backend:$IMAGE_TAG

  deploy-with-ssh:
    name: Deploy App to AWS EC2 Instance
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }} 
      SSH_PRIVATE_KEY: ${{ secrets.EC2_TASKTRACKER_PRIVATEKEY }}
    needs: build-push  
    
    steps:
      - name: configure SSH 
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/EC2_TASKTRACKER_PRIVATEKEY
          chmod 600 ~/.ssh/EC2_TASKTRACKER_PRIVATEKEY
          ssh-keyscan -H 3.81.120.75 >> ~/.ssh/known_hosts

      - name: Deploy app to Local server
        run: |
          ssh -i ~/.ssh/EC2_TASKTRACKER_PRIVATEKEY ubuntu@3.81.120.75 \
          "cd /home/ubuntu/task-tracker-app &&
           IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull &&   
           IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d "

