name: task-tracker ci
on:
  push:
    branches: 
      - main


env:
  DOCKERHUB_USERNAME: prashantmhamunkar
  IMAGE_NAME: tasktracker-app
  IMAGE_TAG: ${{ github.sha }}

jobs:

  build-push:
    name: Checkout code build and push
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Docker Login
         uses: docker/login-action@v4
         with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
         run: docker build -t $DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_TAG .

      - name: Push Image to Docker Hub
         run: docker push $DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_TAG

  Pull-Deploy:
    name: Pull Image and Deploy the App
    runs-on: ubuntu-latest
    needs: build-push  
    steps:
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Pull Image
        run: docker pull $DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_TAG



        

